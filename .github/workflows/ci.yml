name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build packages
        run: |
          pnpm --filter @react-native-data-grid/core build
          pnpm --filter @react-native-data-grid/react-native build

      - name: Smoke test packed packages as an external consumer
        run: pnpm test:package-consumer

  android-e2e:
    name: Android native E2E
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Maestro
        run: pnpm test:e2e:setup

      - name: Build demo packages
        run: pnpm build

      - name: Run Android native E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          script: |
            pnpm --filter @react-native-data-grid/demo exec expo run:android --no-bundler
            pnpm --filter @react-native-data-grid/demo start -- --non-interactive --port 8081 > /tmp/metro.log 2>&1 &
            for attempt in {1..30}; do
              if curl --fail --silent http://localhost:8081/status | grep --quiet 'packager-status:running'; then
                break
              fi
              sleep 2
            done
            curl --fail --silent http://localhost:8081/status | grep --quiet 'packager-status:running'
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              pnpm test:e2e:smoke
            else
              pnpm test:e2e
            fi

      - name: Upload Metro log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-metro-log
          path: /tmp/metro.log
          if-no-files-found: ignore
